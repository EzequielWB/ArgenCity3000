<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArgenCity 3000 · Laboratorio de estilos</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #1f1611;
        color: #efe6d8;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      h2 {
        margin: 28px 0 2px;
        font-size: 18px;
        color: #e0a526;
      }
      p {
        margin: 0 0 10px;
        color: #c9b79a;
        max-width: 70ch;
      }
      canvas {
        display: block;
        max-width: 100%;
        image-rendering: pixelated;
        border: 2px solid #6b5137;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
      }
      button {
        background: #3a2a1e;
        color: inherit;
        border: 1px solid #6b5137;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #e0a526;
        color: #1f1611;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Laboratorio de estilos</h1>
    <p>La misma escena dibujada en tres direcciones. Es una prueba para elegir el estilo: todavía no está en el juego.</p>
    <div class="bar">
      Zoom:
      <button data-scale="2" aria-pressed="false">×2</button>
      <button data-scale="3" aria-pressed="true">×3</button>
      <button data-scale="4" aria-pressed="false">×4</button>
    </div>
    <div id="lab"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
