<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArgentinaCity 3000</title>
    <meta name="description" content="City-builder isométrico con identidad argentina." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 10 16 17 3 10z' fill='%23e0a526'/%3E%3Cpath d='M3 10v11l13 7V17z' fill='%23b4532f'/%3E%3Cpath d='M29 10v11l-13 7V17z' fill='%236fb7e0'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@400;700;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="hidden">
      <header id="topbar">
        <div class="brand"><span class="logo">ArgentinaCity <b>3000</b></span></div>
        <div class="city"><span id="cityName"></span><small id="cityType"></small></div>
        <div class="stat"><label>Fecha</label><span id="date">Ene 1990</span></div>
        <div class="speed" id="speed" role="group" aria-label="Velocidad"></div>
        <div class="stat"><label>Caja</label><span id="cash"></span></div>
        <div class="stat"><label>Población</label><span id="pop"></span></div>
        <div class="rci" id="rci" title="Demanda: Residencial, Comercial, Industrial">
          <div class="bar r"><i></i><span>R</span></div>
          <div class="bar c"><i></i><span>C</span></div>
          <div class="bar i"><i></i><span>I</span></div>
        </div>
        <nav class="menu">
          <button id="btnBudget" title="Presupuesto (P)">Presupuesto</button>
          <button id="btnSave" title="Guardar o cargar (G)">Partidas</button>
          <button id="btnHelp" title="Ayuda (H)">Ayuda</button>
          <button id="btnMenu" title="Volver al inicio">Inicio</button>
        </nav>
      </header>

      <aside id="toolbar" class="filete"></aside>

      <main id="stage">
        <canvas id="game"></canvas>
        <div id="minimapBox" class="filete"><canvas id="minimap" width="200" height="104"></canvas></div>
        <div id="info" class="card filete hidden" role="dialog" aria-label="Consulta"></div>
        <div id="tooltip" class="hidden"></div>
        <div id="toasts" aria-live="polite"></div>
      </main>

      <aside id="diario">
        <header class="masthead">
          <span class="kicker">Edición del día</span>
          <h2>El Diario del Conurbano</h2>
          <span class="dateline" id="newsDate"></span>
        </header>
        <ol id="news"></ol>
      </aside>

      <footer id="status"><span id="statusTool"></span><span id="statusCell"></span></footer>
    </div>

    <section id="start" class="screen">
      <div class="start-card filete">
        <h1 class="logo big">ArgentinaCity <b>3000</b></h1>
        <p class="tagline">Fundá tu ciudad, Intendente. Calles, luz, barrios y un diario que no perdona.</p>
        <div class="start-grid">
          <div class="start-form">
            <label>Nombre de la ciudad
              <input id="startName" maxlength="32" autocomplete="off" />
            </label>
            <label>Semilla del mapa
              <span class="row"><input id="startSeed" inputmode="numeric" maxlength="9" /><button id="startReroll" type="button" title="Otro mapa">Otro mapa</button></span>
            </label>
            <div class="row">
              <button id="startNew" class="primary" type="button">Fundar ciudad</button>
              <button id="startLoad" type="button">Cargar partida</button>
            </div>
          </div>
          <figure class="start-preview">
            <canvas id="startMap" width="220" height="220"></canvas>
            <figcaption>Vista del terreno</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <div id="modal" class="screen hidden" role="dialog" aria-modal="true">
      <div class="modal-card filete">
        <button class="close" id="modalClose" aria-label="Cerrar">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
